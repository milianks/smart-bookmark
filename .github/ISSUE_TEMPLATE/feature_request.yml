name: Feature request
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述当前的不便或缺失，而不是直接给方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      multiple: true
      options:
        - 分类 / 自动整理
        - 内容辅助分类
        - Review 确认
        - 历史扫描
        - 摘要与标签
        - 设置 / 权限
        - 其他
    validations:
      required: true
